name: Deploy VPS

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      # Utilisateur non-root dédié au déploiement (deploy/setup-deploy-user.sh) ; variable SSH_USER pour le surcharger.
      SSH_USER: ${{ vars.SSH_USER || 'deploy' }}
      APP_DIR: /home/matchzy/app
      SITE_URL: https://matchzy.neoheberg.fr

    steps:
      # Actions épinglées sur un SHA de commit : un tag peut être déplacé, pas un SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Le VPS (512 Mo) ne peut pas compiler Next : on compile ici et on envoie le serveur autonome.
      - name: Compiler
        run: |
          npm ci
          npm run build
          # Jamais de secrets ni de base locale dans le serveur envoyé
          rm -rf .next/standalone/.env* .next/standalone/data
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
        env:
          # Valeurs factices pour les modules serveur (la compilation n'ouvre pas la base).
          SESSION_SECRET: ci
          ORGANIZER_PASSWORD: ci

      - name: Préparer SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST_FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          actual=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          if [ "$actual" != "$SSH_HOST_FINGERPRINT" ]; then
            echo "Empreinte SSH inattendue : $actual (attendue : $SSH_HOST_FINGERPRINT)"
            exit 1
          fi

      # --delete ne nettoie que server/ et deploy/ : le .env à la racine de l'app n'est jamais touché.
      # Fichiers à deploy, groupe matchzy : server/ modifiable par l'app (cache de Next), deploy/ en lecture seule.
      - name: Envoyer les fichiers
        run: |
          rsync -rltz --delete --chown=:matchzy --chmod=Dug=rwx,Do=,Fug=rwX,Fo= -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ "$SSH_USER@$SSH_HOST:$APP_DIR/server/"
          rsync -rltz --delete --chown=:matchzy --chmod=Du=rwx,Dg=rx,Do=,Fu=rwX,Fg=rX,Fo= -e "ssh -i ~/.ssh/deploy_key" \
            deploy "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Déployer
        run: ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "bash $APP_DIR/deploy/deploy.sh"

      - name: Vérifier le site
        run: ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3009/health"
