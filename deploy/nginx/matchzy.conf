# Matchzy — reverse proxy vers le serveur Next (PM2, 127.0.0.1:3009)
# À copier dans /etc/nginx/sites-available/matchzy.conf
# Le domaine passe par Cloudflare (mode SSL strict) : le certificat Let's Encrypt
# ci-dessous est celui que Cloudflare vérifie côté serveur.

server {
    listen 80;
    listen [::]:80;
    server_name matchzy.neoheberg.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://matchzy.neoheberg.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matchzy.neoheberg.fr;

    ssl_certificate     /etc/letsencrypt/live/matchzy.neoheberg.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matchzy.neoheberg.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Fichiers compilés de Next (noms horodatés) : cache long, servis par Next.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass         http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }
}
